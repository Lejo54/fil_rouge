<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/chat.css">
    <title>My Chats</title>
</head>

<body>

    <ul class="nav-bar">
        <li class="nav-element"><a href="../index.html">Home</a></li>
        <li class="nav-element"><a href="./chat.html" class="active">My Chats</a></li>
        <li class="nav-element"><a href="../contact/contact.html">Contact</a></li>
    </ul>

    <div class="chat-wrapper">
        <!-- Boîte blanche au milieu qui affiche les messages -->
        <div class="chat-display-box" id="chat-display-box"></div>

        <!-- Boîte de message en bas -->
        <div class="aligne-en-bas">
            <textarea id="message-input" name="message" rows="1" placeholder="Écrivez votre message ici..."></textarea>
            <button type="button" id="btn-send" class="btn-send" title="Envoyer"></button>
        </div>
    </div>
    <!-- Ouvre le boutton -->
    <button id="open-box">Curr€ncy Converter</button>

    <!-- box default hidden -->
    <dialog id="box-converter">
        <h2>Currency converter</h2>
        <!-- Currency form -->
        <form name="Convert" class="gros-carre">

            <h2 class="rectangle-haut">Currency converter</h2>

            <!-- Base currency -->
            <label for="baseAmount" class="label-text">Base Amount</label><br>
            <select name="base-currency" id="base-currency"></select>
            <input type="text" id="baseAmount" name="baseAmount" class="champ-texte"><br>

            <!-- Convert currency -->
            <label for="convertAmount" class="label-text">Convert Amount</label><br>
            <select name="convert-currency" id="convert-currency"></select>
            <input type="text" id="convertAmount" name="convertAmount" class="champ-texte" readonly><br>

            <!-- Convert button -->            
            <p class="conteneur-boutons">
                <button for="convert" id="convert" class="bouton-bas"> Convert </button>
            </p>
        </form> 

        <!-- close button -->
        <button id="close-box">close</button>
    </dialog>

    <!-- Supabase et Java -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabaseClient.js"></script>
    <script src="../env.js"></script>
    <script src="../currency_converter/currency_converter.js"></script>
    <script src="./chat.js"></script>
</body>

</html>
