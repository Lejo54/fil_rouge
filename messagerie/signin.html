<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messagerie: Connect</title>
</head>
<body>
  <h2>Connection</h2>

<!-- Connection form -->
  <form name="Connect">

    <!-- User login -->
  <label for="login">Login</label><br>
  <input type="text" id="login" name="login"><br>

  <!-- User password -->
  <label for="pwd">Password</label><br>
  <input type="text" id="pwd" name="pwd"><br>

  <!-- Go to signup page -->
  <label for="signup">
    <button>
       <a href="/messagerie/creation_account/signup.html" title="Create an account">Signup</a> 
    </button>
  </label>

  <!-- Submit form -->
  <input type="submit" value="Submit">
  </form> 
</body>
</html>
