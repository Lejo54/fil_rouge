<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/logo.png">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/form.css">
    <link rel="stylesheet" href="./css/converter.css">
    <title>Home page</title>
</head>

<body>
    <ul id="nav-bar" class="nav-bar">
        <li class="nav-element"><a href="./index.html" class="active">Home</a></li>
        <li class="nav-element"><a href="./chat/chat.html">My Chats</a></li>
        <li class="nav-element"><a id="sign-out">Logout</a></li>
        <li id="nav-signin" class="nav-element"><a href="./connection/signin.html" title="Connect">Signin</a></li>
        <li id="nav-signup" class="nav-element"><a href="./creation_account/signup.html"
                title="Create an account">Signup</a></li>
        <li id="pub-list"> </li>
    </ul>

    <div id="main-interface" class="main-interface">
        <span id="main-text"></span>
        <img id="main-gif" class="main-gif" src="https://media1.tenor.com/m/aGhuCpSxfDIAAAAC/plink-explosion.gif"
            width="498" height="211" alt="GIF animé d'un chat qui fait « plink »" hidden>
        <p id="conteneur-boutons" class="conteneur-boutons">

            <!-- Go to signin page -->
            <label for="signin" class="bouton-bas">
                <button>
                    <a href="./connection/signin.html" title="Connect">Log in</a>
                </button>
            </label>

            <!-- Go to signup page -->
            <label for="signup" class="bouton-bas">
                <button>
                    <a href="./creation_account/signup.html" title="Create an account">Create an account</a>
                </button>
            </label>

        </p>
    </div>

    <!-- open button -->
    <button id="open-box" class="converter-button">Curr€ncy Converter</button>

    <!-- box default hidden -->
    <dialog id="box-converter" class="box-converter">
        <!-- Currency form -->
        <div class="form-converter">
            <form name="Convert" class="gros-carre" id="converter">

                <h2 class="rectangle-haut">Currency converter</h2>

                <!-- Base currency -->
                <label for="base-amount" class="label-text">Base Amount</label><br>
                <div class="select-currency">
                    <select name="base-currency" id="base-currency"></select>
                </div>
                <input type="text" id="base-amount" name="base-amount" class="champ-texte"><br>

                <!-- Convert currency -->
                <label for="convert-amount" class="label-text">Convert Amount</label><br>
                <div class="select-currency">
                    <select name="convert-currency" id="convert-currency"></select>
                </div>
                <input type="text" id="convert-amount" name="convert-amount" class="champ-texte" readonly><br>

                <!-- buttons -->
                <p class="conteneur-boutons">
                    <!-- close button -->
                    <button type="button" id="close-box" class="bouton-bas">Close</button>
                    <!-- convert button -->
                    <button for="convert" id="convert" class="bouton-bas"> Convert </button>
                </p>
            </form>
        </div>
    </dialog>

    <!-- Scripts (order matters: each file relies on globals defined by the previous ones) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./utils/supabaseClient.js"></script>
    <script src="./utils/auth.js"></script>
    <script src="./utils/home.js"></script>
    <script src="./utils/env.js"></script>
    <script src="./currency_converter/currency_converter.js"></script>
    <script src="./utils/pub.js"></script>
</body>

</html>
