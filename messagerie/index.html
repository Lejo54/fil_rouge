<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/base.css">
    <title>Home page</title>
</head>
<body>


    <ul class="nav-bar">
        <li class="nav-element"><a href="./index.html" class="active">Home</a></li>
        <li class="nav-element"><a href="./Chats">My Chats</a></li>
        <li class="nav-element"><a href="./contact/contact.html">Contact</a></li>
        <li class="nav-element"><a href="./logout">Logout</a></li>
        <li class="nav-element"><a href="./signin.html" title="Connect">Signin</a></li>
        <li class="nav-element"><a href="./creation_account/signup.html" title="Create an account">Signup</a></li>
    </ul>

    <div class="main-interface">
        Please log in or create an account to access the email.</br>
        <p class="conteneur-boutons">

            <!-- Go to signin page -->
            <label for="signin" class="bouton-bas">
                <button>
                    <a href="./signin.html" title="Connect">Log in</a>
                </button>
            </label>

            <!-- Go to signup page -->
            <label for="signup" class="bouton-bas">
                <button>
                    <a href="./creation_account/signup.html" title="Create an account">Create an account</a>
                </button>
            </label>

        </p>
    </div>

    <!-- open button -->
    <button id="open-box">Curr€ncy Converter</button>

    <!-- box default hidden -->
    <dialog id="box-converter">
        <h2>Currency converter</h2>
        <!-- Currency form -->
        <form name="Convert" class="gros-carre">

            <h2 class="rectangle-haut">Currency converter</h2>

            <!-- Base currency -->
            <label for="baseAmount" class="label-text">Base Amount</label><br>
            <select name="base-currency" id="base-currency">
                <option value="">--Choose base currency--</option>
                <option value="euro">Euro(€)</option>
            </select>
            <input type="text" id="baseCurrency" name="baseCurrency" class="champ-texte"><br>

            <!-- Convert currency -->
            <label for="convertAmount" class="label-text">Convert Amount</label><br>
            <select name="convert-currency" id="convert-currency">
                <option value="">--Choose convert currency--</option>
                <option value="euro">Euro(€)</option>
            </select>
            <input type="text" id="convertAmount" name="convertAmount" class="champ-texte"><br>

            <!-- Convert button -->            
            <p class="conteneur-boutons">
                <button for="convert" id="convert" class="bouton-bas"> Convert </button>
            </p>
        </form> 

        <!-- close button -->
        <button id="close-box">close</button>
    </dialog>

    <script src="./env.js"></script>
    <script src="./currency_converter/currency_converter.js"></script>
</body>
</html>
