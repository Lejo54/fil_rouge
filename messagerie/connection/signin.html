<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../images/logo.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/form.css">
  <title>Messagerie: Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- The line above loads the official Supabase library, required by the scripts below -->
  <script src="../utils/supabaseClient.js" defer></script>
  <script src="../utils/auth.js" defer></script>
  <script src="./connection.js" defer></script>
</head>

<body>

  <div class="form">
    <!-- Sign in form -->
    <form id="Connect" class="gros-carre">

      <h2 class="rectangle-haut">Connection</h2>

      <!-- User login -->
      <label for="login" class="label-text">Login</label><br>
      <input type="text" id="login" name="login" class="champ-texte"><br>

      <!-- User password -->
      <label for="pwd" class="label-text">Password</label><br>
      <input type="password" id="pwd" name="pwd" class="champ-texte"><br>

      <!-- Buttons -->
      <p class="conteneur-boutons">
        <!-- Go to signup page -->
        <label for="signup" class="bouton-bas" id="signup">
          <button>
            <a href="../creation_account/signup.html" title="Create an account">Signup</a>
          </button>
        </label>

        <!-- Submit form -->
        <input type="submit" value="Submit" class="bouton-bas">
      </p>
    </form>
  </div>
</body>

</html>
